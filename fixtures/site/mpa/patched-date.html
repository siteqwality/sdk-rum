<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUM fixture: patched Date</title>
  <script>
    // Like thesecretsproject.com: the page replaces Date (constructor and Date.now) before any
    // other script, so it reads Wednesday, October 4, 2000, ticking from there.
    (function () {
      var RealDate = Date;
      var shift = RealDate.UTC(2000, 9, 4, 12) - RealDate.now();
      function PatchedDate() {
        var args = Array.prototype.slice.call(arguments);
        var d = args.length ? new (Function.prototype.bind.apply(RealDate, [null].concat(args)))() : new RealDate(RealDate.now() + shift);
        Object.setPrototypeOf(d, PatchedDate.prototype);
        return d;
      }
      PatchedDate.prototype = Object.create(RealDate.prototype);
      PatchedDate.prototype.constructor = PatchedDate;
      PatchedDate.now = function () { return RealDate.now() + shift; };
      PatchedDate.UTC = RealDate.UTC;
      PatchedDate.parse = RealDate.parse;
      window.Date = PatchedDate;
      window.fixtureRealNow = function () { return RealDate.now(); };
    })();
  </script>
  <script src="/boot.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main data-fixture-page="patched-date">
    <h1>Patched Date</h1>
    <p data-testid="today"></p>
    <label>Type here <input data-testid="date-input"></label>
    <button data-testid="date-button">Click</button>
    <button data-testid="date-error">Throw</button>
  </main>
  <script>
    document.querySelector('[data-testid=today]').textContent = new Date().toDateString();
    document.querySelector('[data-testid=date-button]').onclick = function () { this.classList.toggle('on'); };
    document.querySelector('[data-testid=date-error]').onclick = function () {
      setTimeout(function () { throw new Error('fx:patched-date error'); });
    };
  </script>
</body>
</html>
